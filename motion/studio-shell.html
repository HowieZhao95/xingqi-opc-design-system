<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>星启 OPC · 动效组件</title>
<style>
*{box-sizing:border-box}html{color-scheme:dark;background:var(--bg)}body{margin:0;min-width:270px;background:var(--bg);color:var(--ink);font-family:OPCSans,"PingFang SC","Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit}button,a,summary,input,select,textarea{outline-offset:3px}button,input,select,textarea{border-radius:14px}button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--cyan)}button{color:var(--ink);border:1px solid var(--line);background:var(--surface);min-height:42px;padding:7px 17px;cursor:pointer;transition:background-color .16s,color .16s,border-color .16s}button:hover{border-color:var(--cyan)}button:disabled{opacity:.5;cursor:default}main{max-width:1500px;margin:0 auto;padding:26px clamp(18px,5vw,78px) 32px}
.masthead,.heading,.toolbar,.motionbar,.footer,.dialog-actions{display:flex;align-items:center;gap:16px;justify-content:space-between}.masthead{padding-bottom:17px;border-bottom:1px solid var(--line);min-height:46px}.masthead img{width:140px;display:block}.edition,.meta,.time{font:12px OPCMono,monospace;letter-spacing:.035em;font-variant-numeric:tabular-nums}.edition,.meta{color:var(--muted)}.heading{margin:25px 0 19px;align-items:flex-end}.heading h1{margin:0;font:normal clamp(37px,5vw,70px)/1.05 OPCDisplay,"PingFang SC",sans-serif;letter-spacing:.025em}.toolbar{justify-content:flex-end;gap:8px;flex-wrap:wrap}.switch{position:relative}.switch select{color:var(--ink);background:var(--surface);border:1px solid var(--line);padding:8px 32px 8px 14px;height:42px;cursor:pointer;appearance:none}.switch::after{content:"";border:solid var(--muted);border-width:0 1.5px 1.5px 0;padding:3px;display:block;transform:rotate(45deg);position:absolute;right:14px;top:16px;pointer-events:none}
.screen{isolation:isolate;border-radius:clamp(18px,2.4vw,34px);position:relative;display:grid;place-items:center;background:var(--inset);border:1px solid var(--line);overflow:hidden;width:100%;height:auto;aspect-ratio:16/8.2;max-height:62vh;min-height:200px}.canvasbox{position:relative;overflow:hidden;border-radius:clamp(12px,1.7vw,24px)}.stage{position:relative;transform-origin:top left;overflow:hidden}.stage svg{display:block}.motionbar{margin:15px 0 18px;gap:14px}.play,.embedplay{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-width:90px;background:var(--cyan);border-color:transparent;border-radius:999px;color:var(--onAccent)}.play svg,.embedplay svg{height:15px;width:15px}.time{white-space:nowrap;color:var(--muted)}input[type=range]{appearance:none;background:var(--line);border-radius:999px;height:6px;accent-color:var(--cyan);margin:0;flex:1;min-width:60px;cursor:pointer}input[type=range]::-webkit-slider-thumb{appearance:none;height:16px;width:16px;border-radius:50%;background:var(--cyan);border:2px solid var(--bg)}input[type=range]::-moz-range-thumb{height:13px;width:13px;border-radius:50%;background:var(--cyan);border:2px solid var(--bg)}
.shots{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.shots button{border-radius:999px;background:transparent;border-color:transparent;color:var(--muted);padding:6px 13px;min-height:36px}.shots button[aria-pressed=true]{background:var(--raised);border-color:var(--strong);color:var(--ink)}.shots button:hover{color:var(--cyan)}.footer{border-top:1px solid var(--line);padding-top:16px;margin-top:14px;gap:12px;flex-wrap:wrap}.source{font-size:13px;line-height:1.5;color:var(--muted);margin:0;max-width:58ch}.actions{display:flex;gap:8px;flex-wrap:wrap}.primary{background:var(--ink);color:var(--bg);border-color:transparent}.embedplay{display:none;position:absolute;z-index:1;bottom:12px;right:12px;padding:7px 12px;min-width:36px;min-height:34px;opacity:.84}
dialog{background:var(--modal);color:var(--ink);border:1px solid var(--line);border-radius:26px;padding:24px 28px;width:min(535px,calc(100vw - 28px));max-height:85dvh;box-shadow:0 20px 80px rgba(0,0,0,.24)}dialog::backdrop{background:var(--scrim)}dialog h2{font:normal 34px OPCDisplay,sans-serif;margin:0 0 14px}#fields{display:grid;gap:13px}.field-group{display:grid;gap:6px;font-size:14px}.field-group input,.field-group textarea,.field-group select{padding:9px 13px;border:1px solid var(--strong);background:var(--surface);color:var(--ink);min-width:0;width:100%}.field-group textarea{resize:vertical;min-height:66px}.dialog-actions{margin-top:20px;justify-content:flex-end}.feedback{color:var(--ink);font-size:14px;margin:10px 0 3px}.help{font-size:13px;line-height:1.45;color:var(--muted)}[hidden]{display:none!important}
html.embed,html.embed body{height:100%;overflow:hidden;background:var(--bg)}html.embed main{max-width:none;margin:0;padding:0;width:100%;height:100%}html.embed .screen{width:100%;height:100%;min-height:0;max-height:none;aspect-ratio:auto;border-radius:0;background:transparent;box-shadow:none;border:0}html.embed .canvasbox{border-radius:0}html.embed .embedplay{display:inline-flex}html.embed main>:not(.screen){display:none}html.alpha,html.alpha body{background:transparent}html.nocontrols .embedplay{display:none}.reuse{margin-top:13px;color:var(--muted);font-size:13px;line-height:1.65}.reuse summary{cursor:pointer;width:max-content;border-radius:9px}.reuse summary:focus-visible{outline:2px solid var(--cyan)}.reuse p{margin:7px 0;max-width:85ch}.reuse code{font:12px OPCMono,monospace;color:var(--ink)}
@media(max-width:720px){main{padding:17px 15px 25px}.masthead{padding-bottom:11px}.masthead img{width:120px}.heading{margin:20px 0 13px;align-items:center;flex-wrap:wrap;gap:11px}.heading h1{font-size:40px}.toolbar{justify-content:flex-start}.screen{min-height:0;aspect-ratio:16/9}.screen[data-format=portrait]{aspect-ratio:3/4;max-height:60vh}.motionbar{gap:9px}.time{font-size:11px}.play{min-width:65px;padding:6px 11px}.footer{align-items:flex-start}.shots{gap:3px}.shots button{font-size:14px;padding:4px 9px}.edition{font-size:10px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

html:not(.embed) main {display:grid;grid-template-columns:minmax(0,1fr) minmax(205px,24%);column-gap:clamp(18px,3vw,44px);grid-template-areas:"mast mast" "head head" "screen inspect" "controls inspect" "chap inspect" "reuse reuse";max-width:1480px;}
.masthead{grid-area:mast}.heading{grid-area:head}.screen{grid-area:screen}.motionbar{grid-area:controls}.chapters{grid-area:chap}.shot-inspector{grid-area:inspect;align-self:start;min-width:0}.reuse{grid-area:reuse}
.heading{margin:32px 0 25px}.heading h1{font-size:clamp(36px,4vw,57px)}
html:not(.embed) .screen{aspect-ratio:16/9;max-height:none;min-height:0;background:var(--inset);border-radius:22px}
html:not(.embed) .canvasbox{border-radius:inherit}
.shot-inspector h2{font:500 14px/1.5 OPCSans,sans-serif;margin:2px 0 10px;color:var(--muted)}
.shots{display:grid;gap:4px;}
.shots button{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:40px;border-radius:12px;font:500 14px OPCSans,sans-serif;padding:8px 13px;text-align:left}
.shots button[aria-pressed=true]{color:var(--cyan);border-color:color-mix(in srgb,var(--cyan) 42%,var(--bg));background:color-mix(in srgb,var(--cyan) 7%,var(--bg))}
.shots small{color:var(--muted);font:11px OPCMono,monospace}
.shot-inspector .footer{display:flex;flex-direction:column;align-items:stretch;gap:12px;margin-top:18px;padding-top:16px}
.shot-inspector .source{font-size:12px;line-height:1.65;}
.shot-inspector .actions{display:grid;gap:7px;}.actions button{min-height:38px;border-radius:999px}
.shot-inspector .primary{background:var(--cyan);color:var(--onAccent);}
.motionbar{margin:14px 0 8px;align-self:start}
.chapters{display:flex;align-self:start;gap:4px;min-width:0;}
.chapters button{flex:var(--frames) 1 0;min-width:0;display:grid;gap:3px;padding:6px 4px 5px;border:none;background:none;text-align:left;border-radius:6px;min-height:0;color:var(--muted);font:12px OPCSans,sans-serif;}
.chapters button::before{content:"";display:block;width:100%;height:4px;border-radius:99px;background:var(--line);margin-bottom:3px;}
.chapters [aria-current=step]{color:var(--ink);}
.chapters [aria-current=step]::before{background:var(--cyan);}
.chapters small{font:10px OPCMono,monospace;color:var(--muted);}
@media(max-width:850px){html:not(.embed) main{display:block}.heading{margin:18px 0 14px}.chapters{margin-bottom:22px}.shots{display:flex;flex-wrap:wrap;gap:5px}.shots button{padding:5px 10px;min-height:36px}.shots small{display:none}.shot-inspector .footer{flex-direction:row;align-items:center;flex-wrap:wrap}.shot-inspector .actions{display:flex}.shot-inspector{margin-top:18px}.chapters button{font-size:11px}.chapters small{font-size:9px}html:not(.embed) .screen[data-format=portrait]{aspect-ratio:4/5;max-height:60dvh}}
.hud-sibling{font-size:13px;color:var(--cyan);text-underline-offset:4px}
</style></head><body><main>
<header class="masthead"><img id="brand" alt="星启 OPC · AI+社群"><a class="hud-sibling" href="mg-hud.html">光学 HUD 动效库 ↗</a></header>
<div class="heading"><h1>动效工作台</h1><div class="toolbar"><label class="switch"><select id="theme" aria-label="主题"><option value="dark">深色主题</option><option value="light">亮色主题</option></select></label><label class="switch"><select id="format" aria-label="画幅"><option value="wide">横版 16:9</option><option value="portrait">竖版 9:16</option></select></label></div></div>
<div class="screen" id="screen"><div id="box" class="canvasbox"><div class="stage" id="stage" data-composition-id="opc-motion"></div></div><button class="embedplay" id="embedplay" aria-label="播放"></button></div>
<div class="motionbar"><button id="play" class="play" type="button"></button><input id="scrub" type="range" aria-label="定位画面（帧）" min="0" max="449"><output id="time" class="time" for="scrub"></output></div>

<nav id="chapters" class="chapters" aria-label="完整演示时间线，点击定位镜头"></nav>
<aside class="shot-inspector"><h2>镜头组件</h2><nav id="shots" class="shots" aria-label="单独预览组件"></nav>
<footer class="footer"><p class="source" id="source"></p><div class="actions"><button type="button" id="edit">编辑参数</button><button class="primary" type="button" id="download">下载组件 HTML</button></div></footer></aside>
<details class="reuse"><summary>嵌入与复用</summary><p>选择组件，编辑参数后下载 HTML。下载文件可直接播放，也可放进 iframe。打开下载文件时加 <code>?editor=1</code> 可再次编辑。</p><p>在整套文件的地址后添加 <code>?embed=1&amp;scene=CompareBars&amp;frame=60</code> 可嵌入停在第 60 帧的图表。用 <code>format=portrait</code> 切竖版，<code>controls=0</code> 隐藏控件，<code>autoplay=1</code> 自动播放。字幕单独下载时支持透明背景。</p></details>
</main>
<dialog id="editor" aria-labelledby="editorTitle"><form id="form"><h2 id="editorTitle">编辑参数</h2><div id="fields"></div><p class="feedback" id="error" role="alert"></p><p class="help">应用后可预览改动。下载组件 HTML 会保留当前参数、主题和画幅。</p><div class="dialog-actions"><button type="button" id="cancel">取消</button><button type="submit" class="primary">应用参数</button></div></form></dialog>
<script id="mg-settings" type="application/json">__SETTINGS__</script>
<script id="mg-assets">__ASSETS__</script><script id="mg-runtime">__RUNTIME__</script>
<script id="mg-app">__APP__</script>
</body></html>
